# The everyday file: one command, one verdict.
#   probatum run .probatum/dev-check.yaml
- run: bash demo-app/tests/run.sh
- name: app boots
  run: LOG_FILE=demo-app/data/app.log python3 demo-app/app.py
  ready: http://127.0.0.1:8087/healthz
  timeout: 15
  allow: ["migration pending"]
- get: http://127.0.0.1:8087/api/version
  contains: ['"version"']
- get: http://127.0.0.1:8087/api/nope
  expect: 404

# write, then read back: the state written by the POST must be visible
- name: an event can be stored
  post: http://127.0.0.1:8087/api/events
  body: '{"key": "k9", "value": 42}'
  contains: ['"stored": "k9"']
- name: the stored event is visible
  get: http://127.0.0.1:8087/api/version
  contains: ['"keys": 5']
- post: http://127.0.0.1:8087/api/nope
  expect: 404
- name: app log is clean
  log: demo-app/data/app.log
  contains: ["store::replay done"]
  absent: ["ERROR"]
