# probatum checks probatum — dogfooding.
#   probatum run

[[check]]
run = "cargo build --offline"

[[check]]
run = "cargo clippy --offline -- -D warnings"

[[check]]
run = "cargo fmt -- --check"

# the config language is a contract: parser edge cases are unit-tested, where
# an end-to-end case would cost a process and a committed file each
[[check]]
run = "cargo test --offline"
contains = ["test result: ok."]

# --help must stay a complete, self-sufficient description of the surface
[[check]]
name = "--help documents the config surface"
run = "./target/debug/probatum --help"
contains = ["run =", "get =", "post =", "put =", "patch =", "delete =", "log =", "timeout =", "background =", "max_ms =", "min_ms =", "expect =", "absent =", "Set-Cookie", "exit codes", "schema-valid document", "probatum init", "--scenario", "os =", "no_applicable_checks", "not_selected", "os_mismatch", "previous_failure", "capture =", "env =", "dependency_unavailable", "output_withheld"]

# the full demo flow (service + http + external log) must be green
[[check]]
name = "demo is green end-to-end"
run = "./target/debug/probatum run .probatum/dev-check.toml"

# negative scenarios: probatum MUST report these as failures (exit 1 exactly —
# exit 2 would mean "couldn't run", which is not a caught failure)
[[check]]
name = "boot crash is caught"
run = "./target/debug/probatum run .probatum/broken-check.toml"
expect = 1

[[check]]
name = "post-ready degradation is caught"
run = "./target/debug/probatum run .probatum/degraded-check.toml"
expect = 1

[[check]]
name = "never-ready service is caught (timeout = failure)"
run = "./target/debug/probatum run .probatum/hang-check.toml"
expect = 1

# couldn't-run family: these MUST be exit 2 — refusing is not failing
[[check]]
name = "config typo is refused"
run = "./target/debug/probatum run .probatum/invalid-key.toml"
expect = 2

[[check]]
name = "missing log file is couldn't-run, not failed"
run = "./target/debug/probatum run .probatum/missing-log-check.toml"
expect = 2

[[check]]
name = "dirty environment is refused"
run = "python3 demo-app/app.py >/dev/null 2>&1 & P=$!; sleep 1; ./target/debug/probatum run .probatum/degraded-check.toml >/dev/null 2>&1; c=$?; kill $P; test $c -eq 2"

# ownership: probatum crashing mid-run (exit 101) must still free the port
[[check]]
name = "ownership survives probatum's own crash"
run = "PROBATUM_TEST_PANIC=1 ./target/debug/probatum run .probatum/degraded-check.toml >/dev/null 2>&1; test $? -eq 101 && python3 demo-app/tests/portfree.py"

# a chunked response must not produce a false failure (audit finding)
[[check]]
name = "chunked bodies are decoded"
run = "./target/debug/probatum run .probatum/chunked-check.toml"
timeout = 30

# concurrent runs must not collide on the evidence directory
[[check]]
name = "20 concurrent runs each get their own evidence dir"
run = "bash demo-app/tests/concurrent_runs.sh 20"
timeout = 60

# ownership: Ctrl-C (SIGINT) mid-run (exit 130) must still free the port
[[check]]
name = "ownership survives Ctrl-C"
run = "./target/debug/probatum run .probatum/sigint-check.toml >/dev/null 2>&1 & P=$!; sleep 2; kill -INT $P; wait $P; test $? -eq 130 && python3 demo-app/tests/portfree.py"

# SIGTERM must report 143 (128+15), not SIGINT's 130 — orchestrators read it
[[check]]
name = "SIGTERM exits 143 and frees the port"
run = "./target/debug/probatum run .probatum/sigint-check.toml >/dev/null 2>&1 & P=$!; sleep 2; kill -TERM $P; wait $P; test $? -eq 143 && python3 demo-app/tests/portfree.py"
timeout = 30

# a rule of the wrong type must be an error, never a silently dropped rule
[[check]]
name = "non-string rule is refused"
run = "./target/debug/probatum run .probatum/bad-rule-type.toml"
expect = 2

# a hung command must be killed at its deadline, not block the run forever
[[check]]
name = "hung command is killed at its deadline"
run = "./target/debug/probatum run .probatum/hung-command.toml"
expect = 1
timeout = 30

# a correct but late answer is a failure, with the measured time as evidence
[[check]]
name = "over-budget latency is caught"
run = "./target/debug/probatum run .probatum/too-slow.toml"
expect = 1
timeout = 30

# rules read every line of the output, not the first 100,000 kept in memory:
# one check per direction — a false failure and a false pass
[[check]]
name = "contains sees a line past the in-memory bound"
run = "./target/debug/probatum run .probatum/late-lines.toml --scenario contains_late"
timeout = 60

[[check]]
name = "absent catches a line past the in-memory bound"
run = "./target/debug/probatum run .probatum/late-lines.toml --scenario absent_late"
expect = 1
contains = ["FATAL: disk full"]
timeout = 60

# the mirror: a correct answer that arrives too fast is a failure (issue #8)
[[check]]
name = "under-floor latency is caught"
run = "./target/debug/probatum run .probatum/too-fast.toml"
expect = 1
contains = ["under the 500ms floor"]
timeout = 30

# the machine contract: --json must carry the verdict, the schema version and
# per-check timing, on a run that exits 2. Before `expect` on run, probatum
# could not assert its own --json at all: a non-zero exit failed the check
# before any rule was evaluated.
[[check]]
name = "--json carries the machine contract"
run = "./target/debug/probatum run .probatum/missing-log-check.toml --json"
expect = 2
contains = ['"schema": 4', '"verdict"', '"duration_ms"', '"run_dir"']

# --json must answer for EVERY outcome, including the ones where no run
# happened at all: an agent should never have to parse stderr to find out.
[[check]]
name = "--json answers on an invalid config"
run = "./target/debug/probatum run .probatum/invalid-key.toml --json"
expect = 2
contains = ['"schema": 4', '"kind": "invalid_config"', '"message"']
absent = ['"checks"']

[[check]]
name = "--json answers when probatum itself panics"
run = "PROBATUM_TEST_PANIC=1 ./target/debug/probatum run .probatum/background.toml --json 2>/dev/null"
expect = 101
contains = ['"kind": "internal_error"', '"panic: PROBATUM_TEST_PANIC"']
timeout = 30

# the cookie jar: a session set by a login check is replayed by the checks
# that follow — log in, publish, observe (issue #5)
[[check]]
name = "cookie jar carries the session across checks"
run = "./target/debug/probatum run .probatum/auth-check.toml"
timeout = 30

# a background service (no probe) is kept alive for the checks that follow
[[check]]
name = "background service stays up for later checks"
run = "./target/debug/probatum run .probatum/background.toml"
timeout = 30

# Named scenarios: assert structured results and the persisted evidence copy.

[[check]]
name = "scenarios isolate state and run in source order"
run = "./target/debug/probatum run .probatum/scenario-isolation.toml --json | python3 demo-app/tests/scenario_report.py '{\"verdict\": \"pass\", \"scenario_order\": [\"z_login\", \"a_fresh\"], \"executed\": 6, \"excluded\": 0, \"skipped\": 0, \"selected_scenario\": null}'"
contains = ["scenario report verified"]
timeout = 30

# the file reads in the order it runs: a step declared after a higher one is refused
[[check]]
name = "out-of-order steps are refused, not reordered"
run = "printf '[a.2]\\nrun = \"true\"\\n[a.1]\\nrun = \"true\"\\n' | ./target/debug/probatum run -"
expect = 2
contains = ["step 1 is declared after step 2"]

[[check]]
name = "a selected scenario works alone and reports nonselection"
run = "./target/debug/probatum run .probatum/scenario-isolation.toml --json --scenario a_fresh | python3 demo-app/tests/scenario_report.py '{\"verdict\": \"pass\", \"scenario_order\": [\"z_login\", \"a_fresh\"], \"executed\": 3, \"excluded\": 3, \"skipped\": 0, \"selected_scenario\": \"a_fresh\"}'"
contains = ["scenario report verified"]
timeout = 30

[[check]]
name = "OS scope excludes commands, services, HTTP and logs"
run = "./target/debug/probatum run .probatum/scenario-scope.toml --json | python3 demo-app/tests/scenario_report.py '{\"verdict\": \"pass\", \"executed\": 2, \"excluded\": 8, \"skipped\": 0}'"
contains = ["scenario report verified"]
timeout = 30

[[check]]
name = "nothing applicable keeps an exclusion report"
run = "./target/debug/probatum run .probatum/scenario-scope.toml --json --scenario foreign | python3 demo-app/tests/scenario_report.py '{\"verdict\": \"couldn'\"'\"'t-run\", \"executed\": 0, \"excluded\": 10, \"skipped\": 0, \"reason\": \"no_applicable_checks\"}'"
contains = ["scenario report verified"]
timeout = 30

[[check]]
name = "failure skips later scenarios but preserves scope exclusions"
run = "./target/debug/probatum run .probatum/scenario-failure.toml --json | python3 demo-app/tests/scenario_report.py '{\"verdict\": \"fail\", \"failed\": 1, \"executed\": 1, \"excluded\": 1, \"skipped\": 2}'"
contains = ["scenario report verified"]
timeout = 30

[[check]]
name = "observation errors also skip later scenarios"
run = "./target/debug/probatum run .probatum/scenario-error.toml --json | python3 demo-app/tests/scenario_report.py '{\"verdict\": \"couldn'\"'\"'t-run\", \"errored\": 1, \"executed\": 1, \"excluded\": 0, \"skipped\": 1}'"
contains = ["scenario report verified"]
timeout = 30

[[check]]
name = "a silent service exit after startup fails before the next scenario"
run = "./target/debug/probatum run .probatum/scenario-dead-service.toml --json | python3 demo-app/tests/scenario_report.py '{\"verdict\": \"fail\", \"failed\": 1, \"executed\": 2, \"excluded\": 0, \"skipped\": 1}'"
contains = ["scenario report verified"]
timeout = 30

[[check]]
name = "no applicable checks exit 2"
run = "./target/debug/probatum run .probatum/scenario-scope.toml --scenario foreign --json"
expect = 2
timeout = 30
contains = ["\"reason\": \"no_applicable_checks\""]

[[check]]
name = "a failed scenario exits 1"
run = "./target/debug/probatum run .probatum/scenario-failure.toml --json"
expect = 1
timeout = 30
contains = ["\"reason\": \"previous_failure\""]

[[check]]
name = "an unobservable scenario exits 2"
run = "./target/debug/probatum run .probatum/scenario-error.toml --json"
expect = 2
timeout = 30
contains = ["\"reason\": \"previous_failure\""]

[[check]]
name = "unknown scenario is invalid config"
run = "./target/debug/probatum run .probatum/scenario-scope.toml --scenario typo --json"
expect = 2
timeout = 30
contains = ["\"kind\": \"invalid_config\""]
absent = ["\"checks\""]

[[check]]
name = "excluded scenarios are still validated"
run = "./target/debug/probatum run .probatum/scenario-invalid.toml --scenario selected --json"
expect = 2
timeout = 30
contains = ["\"kind\": \"invalid_config\"", "timeuot"]
absent = ["\"checks\""]

[[check]]
name = "unknown CLI options cannot silently select all scenarios"
run = "./target/debug/probatum run .probatum/scenario-scope.toml --scenaro local --json"
expect = 2
timeout = 30
contains = ["\"kind\": \"invalid_config\""]
absent = ["\"checks\""]

[[check]]
name = "commands release background descendants before the next scenario"
run = "./target/debug/probatum run .probatum/scenario-descendants.toml"
expect = 0
timeout = 30
contains = ["all passed"]

[[check]]
name = "selected scenario ownership survives a panic"
run = "PROBATUM_TEST_PANIC=1 ./target/debug/probatum run .probatum/scenario-isolation.toml --scenario a_fresh >/dev/null 2>&1; test $? -eq 101 && python3 demo-app/tests/portfree.py"
expect = 0
timeout = 30

[[check]]
name = "ownership survives SIGTERM in the second scenario"
run = "./target/debug/probatum run .probatum/scenario-signal.toml >/dev/null 2>&1 & P=$!; sleep 2; kill -TERM $P; wait $P; test $? -eq 143 && python3 demo-app/tests/portfree.py"
expect = 0
timeout = 30

[[check]]
name = "replay preserves an exact scenario name with quotes"
run = "./target/debug/probatum run .probatum/scenario-replay.toml --scenario 'editor'\"'\"'s checks' --json | python3 demo-app/tests/scenario_report.py '{\"verdict\": \"pass\", \"executed\": 1, \"excluded\": 1, \"selected_scenario\": \"editor'\"'\"'s checks\"}' --replay"
contains = ["scenario report verified"]
timeout = 30

[[check]]
name = "human output says nothing was verified when all checks are excluded"
run = "./target/debug/probatum run .probatum/scenario-scope.toml --scenario foreign"
expect = 2
contains = ["nothing verified", "requires windows", "excluded"]
absent = ["all passed"]

[[check]]
name = "captured HTTP results supply one shared bearer, including selection and replay"
run = "./target/debug/probatum run .probatum/capture-check.toml"
timeout = 45

[[check]]
name = "stdout captures cross numbered steps as data through environment variables"
run = "python3 demo-app/tests/captures.py command"
contains = "capture command checks verified"
timeout = 20

[[check]]
name = "OS exclusions block capture consumers without starting excluded targets"
run = "python3 demo-app/tests/captures.py scope"
contains = "capture scope checks verified"
timeout = 20

[[check]]
name = "captured values stay private and services are released on panic and signals"
run = "python3 demo-app/tests/captures.py ownership"
contains = "capture ownership checks verified"
timeout = 45
