# Project override: the stock probatum preset runs ./probatum.toml, which in
# THIS repo needs the host toolchain (cargo, python3) — that suite runs
# natively in .github/workflows/ci.yml. In-container we run the image
# selfcheck instead: it proves the shipped image can run checks at all.
[presets.probatum]
name = "probatum"
phase = "test"
image = "ghcr.io/probatum-org/probatum:0.5.0"
command = "run .probatum/selfcheck.toml"
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]
# (rustfmt override removed: fixed upstream in cidx 2.1.0 — cidx-org/cidx#163.
# The CI bootstrap needs no manual pin since cidx 3.1.0: `generate` writes the
# /v3 module path pinned to the exact generating version — cidx-org/cidx#395.)

# (cargo-audit override removed: fixed upstream in cidx 3.0.0 — extracts to
# /tmp and runs as non-root; cidx-org/cidx#188.)
