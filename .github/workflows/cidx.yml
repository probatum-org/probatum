# Generated by cidx generate github
# Source of truth: cidx.toml
#
# Regenerate with: cidx generate github -o .github/workflows/cidx.yml

name: CIDX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Install CIDX
        run: |
          mkdir -p bin
          # pinned to the v3.0.0 commit: the /v2 module path makes v3 tags unreachable and @latest resolves to v2.4.0 (cidx-org/cidx#187 recurrence)
          go install github.com/cidx-org/cidx/v2/cmd/cidx@aff6625
          cp "$(go env GOPATH)/bin/cidx" bin/cidx
      - uses: actions/upload-artifact@v7
        with:
          name: cidx-binary
          path: bin/cidx
          retention-days: 1

  security:
    name: Security
    runs-on: ubuntu-latest
    needs: [bootstrap]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: cidx-binary
          path: bin
      - run: chmod +x bin/cidx
      - name: Run security
        run: ./bin/cidx run security

  code:
    name: Code
    runs-on: ubuntu-latest
    needs: [bootstrap]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: cidx-binary
          path: bin
      - run: chmod +x bin/cidx
      - name: Run code
        run: ./bin/cidx run code

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [bootstrap]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: cidx-binary
          path: bin
      - run: chmod +x bin/cidx
      - name: Run test
        run: ./bin/cidx run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [bootstrap]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: cidx-binary
          path: bin
      - run: chmod +x bin/cidx
      - name: Run build
        run: ./bin/cidx run build

