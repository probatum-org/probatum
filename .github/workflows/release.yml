name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # attach the binary to the release
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-unknown-linux-musl
      - name: build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${{ github.repository }}"
          docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
      # Without this, installing probatum needs Rust, Docker or cidx.
      # Works whichever order the release and the tag are created in.
      - name: attach the static binary to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp target/x86_64-unknown-linux-musl/release/probatum probatum-x86_64-linux
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" probatum-x86_64-linux --clobber \
            || gh release create "$GITHUB_REF_NAME" probatum-x86_64-linux --generate-notes
