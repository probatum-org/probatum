# Nothing in this repo watches its own dependencies going stale — probatum
# verifies a running system, it is not a supply-chain monitor. Dependabot is.
#
# The three things that can rot here: the actions our workflows pin, the
# crates we build against, and the container base (alpine 3.20 shipped four
# months past its end of life before anyone noticed — see v0.6.1).
#
# Grouped so each ecosystem opens one PR a week rather than one per bump.
# commit-message: commits must be conventional (commitizen checks them in CI),
# and Dependabot's default "Bump …" is not — without the prefix no update passes.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      crates:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
